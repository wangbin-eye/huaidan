<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="description" content="趣味人格小测试：40 道日常情境题，照见你灵魂里最亮的那一道七恩赐。本测试仅供娱乐，不构成任何专业心理诊断。">
<title>测测你的灵魂对应哪一道七恩赐</title>
<style>
  :root {
    --bg-deep: #0b0e1a;
    --bg-card: rgba(20, 24, 40, 0.82);
    --gold: #d4af6a;
    --gold-soft: #e8cf9a;
    --text-main: #f0ead8;
    --text-sub: #a8a090;
    --border: rgba(212, 175, 106, 0.22);
    --accent: var(--gold);
    --accent-soft: var(--gold-soft);
    --accent-border: var(--border);
    --accent-glow: rgba(212, 175, 106, 0.2);
    --accent-tint: rgba(212, 175, 106, 0.05);
    --radius: 18px;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    --font-serif: 'Songti SC', 'Noto Serif SC', 'STSong', Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.6;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(212, 175, 106, 0.09), transparent),
      radial-gradient(ellipse 50% 40% at 85% 90%, rgba(100, 80, 160, 0.06), transparent),
      radial-gradient(ellipse 40% 35% at 10% 80%, rgba(180, 120, 60, 0.05), transparent);
    pointer-events: none; z-index: 0;
  }
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 640px;
    margin: 0 auto;
    padding: 0 18px 60px;
  }

  /* ---------- 开始页 ---------- */
  .screen { display: none; animation: fadeUp 0.5s ease both; }
  .screen.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .start-wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 40px 0 60px;
  }
  .start-symbol {
    width: 88px; height: 88px;
    margin-bottom: 28px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .start-symbol .flame {
    position: absolute;
    width: 14px; height: 14px;
    background: var(--gold);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg) scale(0.9);
    opacity: 0.85;
    box-shadow: 0 0 24px rgba(212, 175, 106, 0.55);
    animation: flicker 2.4s ease-in-out infinite alternate;
  }
  .start-symbol .flame:nth-child(1) { top: 2px; left: 50%; transform: translateX(-50%) rotate(-45deg) scale(0.6); animation-delay: 0s; }
  .start-symbol .flame:nth-child(2) { top: 18px; right: 4px; transform: rotate(-10deg) scale(0.75); animation-delay: 0.3s; }
  .start-symbol .flame:nth-child(3) { top: 18px; left: 4px; transform: rotate(-80deg) scale(0.75); animation-delay: 0.6s; }
  .start-symbol .flame:nth-child(4) { bottom: 10px; right: 16px; transform: rotate(20deg) scale(0.85); animation-delay: 0.9s; }
  .start-symbol .flame:nth-child(5) { bottom: 10px; left: 16px; transform: rotate(-110deg) scale(0.85); animation-delay: 1.2s; }
  .start-symbol .flame:nth-child(6) { bottom: 2px; left: 50%; transform: translateX(-50%) rotate(-45deg) scale(1); animation-delay: 1.5s; }
  .start-symbol .flame:nth-child(7) { top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg) scale(0.45); background: var(--gold-soft); animation-delay: 0.45s; }
  @keyframes flicker {
    0% { opacity: 0.65; box-shadow: 0 0 16px rgba(212,175,106,0.35); }
    100% { opacity: 1; box-shadow: 0 0 32px rgba(212,175,106,0.7); }
  }
  .start-eyebrow {
    font-family: var(--font-serif);
    font-size: 0.78rem;
    letter-spacing: 0.42em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .start-title {
    font-family: var(--font-serif);
    font-size: clamp(1.9rem, 7vw, 2.7rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.3;
    color: var(--text-main);
    margin-bottom: 14px;
  }
  .start-title span { color: var(--gold); }
  .btn {
    display: inline-flex;
    align-items: center; justify-content: center;
    gap: 8px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: var(--font-serif);
    font-size: 1.02rem;
    letter-spacing: 0.14em;
    padding: 14px 42px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.28s ease;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.28s ease;
    z-index: -1;
  }
  .btn:hover, .btn:active {
    color: var(--bg-deep);
    box-shadow: 0 0 36px rgba(212, 175, 106, 0.35);
  }
  .btn:hover::after, .btn:active::after { opacity: 1; }
  .btn.ghost {
    border-color: var(--border);
    color: var(--text-sub);
    font-size: 0.9rem;
    padding: 12px 32px;
    letter-spacing: 0.08em;
  }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .btn.ghost::after { display: none; }
  .start-note {
    margin-top: 22px;
    font-size: 0.74rem;
    color: rgba(168, 160, 144, 0.55);
    letter-spacing: 0.06em;
  }
  .start-disclaimer {
    margin-top: 10px;
    font-size: 0.7rem;
    color: rgba(168, 160, 144, 0.4);
    letter-spacing: 0.04em;
    max-width: 300px;
    line-height: 1.7;
  }
  .share-disclaimer {
    font-size: 0.7rem;
    color: rgba(168, 160, 144, 0.4);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  /* ---------- 测试页 ---------- */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0 6px;
    gap: 12px;
  }
  .quiz-brand {
    font-family: var(--font-serif);
    font-size: 0.82rem;
    letter-spacing: 0.22em;
    color: var(--gold);
    white-space: nowrap;
  }
  .quiz-count {
    font-size: 0.8rem;
    color: var(--text-sub);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }
  .progress-track {
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    margin: 10px 0 32px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(212,175,106,0.5), var(--gold));
    border-radius: 2px;
    transition: width 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .question-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(24px, 5vw, 36px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
  }
  .q-index {
    font-family: var(--font-serif);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: var(--gold);
    margin-bottom: 14px;
    opacity: 0.85;
  }
  .q-text {
    font-size: clamp(1.06rem, 3.8vw, 1.22rem);
    font-weight: 600;
    line-height: 1.65;
    margin-bottom: 26px;
    color: var(--text-main);
  }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 15px 17px;
    color: var(--text-main);
    font-size: 0.94rem;
    line-height: 1.55;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-sans);
    -webkit-appearance: none;
  }
  .option:active { transform: scale(0.985); }
  .option.selected {
    border-color: var(--gold);
    background: rgba(212, 175, 106, 0.1);
    box-shadow: 0 0 0 1px rgba(212, 175, 106, 0.25);
  }
  .option-marker {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem;
    color: var(--text-sub);
    margin-top: 1px;
    transition: all 0.2s ease;
    font-family: var(--font-serif);
  }
  .option.selected .option-marker {
    border-color: var(--gold);
    background: var(--gold);
    color: var(--bg-deep);
    font-weight: 700;
  }
  .quiz-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px;
    gap: 12px;
  }
  .btn-nav {
    background: none; border: none;
    color: var(--text-sub);
    font-size: 0.86rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    padding: 8px 4px;
    transition: color 0.2s;
    font-family: var(--font-sans);
  }
  .btn-nav:hover { color: var(--gold); }
  .btn-nav:disabled { opacity: 0.2; pointer-events: none; }
  .btn-nav.primary { color: var(--gold); font-weight: 600; }

  /* ---------- 结果页 ---------- */
  .result-hero {
    text-align: center;
    padding: 48px 0 36px;
  }
  .result-flame-icon {
    width: 64px; height: 64px;
    margin: 0 auto 22px;
    position: relative;
  }
  .result-icon {
    display: flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    font-family: var(--font-serif);
    font-size: 2.3rem;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 28px var(--accent-glow);
  }
  .result-hero { position: relative; overflow: hidden; }
  .result-hero::before {
    content: ''; position: absolute; top: -12%; left: 50%; transform: translateX(-50%);
    width: 320px; height: 260px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .result-hero > * { position: relative; z-index: 1; }
  .result-gift-name {
    font-family: var(--font-serif);
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--accent);
    line-height: 1.15;
    margin-bottom: 10px;
    text-shadow: 0 0 60px var(--accent-glow);
  }
  .result-gift-en {
    font-family: var(--font-serif);
    font-size: 0.78rem;
    letter-spacing: 0.34em;
    color: var(--text-sub);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .result-tagline {
    display: inline-block;
    font-size: 0.96rem;
    color: var(--accent-soft);
    border-top: 1px solid var(--accent-border);
    border-bottom: 1px solid var(--accent-border);
    padding: 12px 22px;
    letter-spacing: 0.06em;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
  }

  .result-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(22px, 4.5vw, 30px);
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
  }
  .section-label {
    font-family: var(--font-serif);
    font-size: 0.74rem;
    letter-spacing: 0.26em;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--accent-border);
  }
  .section-body {
    font-size: 0.94rem;
    line-height: 1.85;
    color: var(--text-main);
    opacity: 0.92;
  }
  .section-body p + p { margin-top: 10px; }
  .trait-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px;
  }
  .trait-chip {
    font-size: 0.8rem;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--accent-border);
    color: var(--accent-soft);
    letter-spacing: 0.04em;
  }
  .hidden-gift {
    color: var(--accent-soft);
    font-weight: 600;
  }
  .easter-egg {
    background: var(--accent-tint);
    border-style: dashed;
  }

  .share-bar {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    margin-top: 30px;
  }
  .share-hint {
    font-size: 0.72rem;
    color: rgba(168, 160, 144, 0.5);
    letter-spacing: 0.08em;
  }

  /* ---------- 分享卡片遮罩（纯展示，无需截图也能看） ---------- */
  .card-preview {
    margin-top: 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(160deg, rgba(20,24,40,0.95), rgba(12,14,24,0.98));
    padding: 26px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card-preview::before {
    content: '';
    position: absolute; top: -40%; left: 50%; transform: translateX(-50%);
    width: 260px; height: 260px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }
  .card-preview .cp-brand {
    font-family: var(--font-serif);
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--text-sub);
    margin-bottom: 12px;
  }
  .card-preview .cp-gift {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.12em;
    line-height: 1.2;
  }
  .card-preview .cp-tag {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-sub);
    line-height: 1.6;
    max-width: 280px;
    margin-left: auto; margin-right: auto;
  }
  .card-preview .cp-divider {
    width: 30px; height: 1px;
    background: var(--accent-border);
    margin: 16px auto;
  }
  .card-preview .cp-traits {
    font-size: 0.7rem;
    color: var(--accent-soft);
    letter-spacing: 0.1em;
  }
  /* ========== V2.0 分享功能 ========== */
.share-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  margin-top: 18px;
}

.share-actions .btn {
  width: 100%;
  padding: 13px 10px;
  font-size: 0.88rem;
  letter-spacing: 0.04em;
}

.share-actions .btn-download {
  background: linear-gradient(135deg, #d4af6a, #a9813e);
  color: #0b0e1a;
  font-weight: 700;
}

.share-actions .btn-download::after {
  display: none;
}

.share-actions .btn-download:hover {
  box-shadow: 0 0 25px rgba(212,175,106,.4);
}

.share-actions .btn-copy {
  grid-column: 1 / -1;
}

.share-status {
  min-height: 22px;
  color: #d4af6a;
  text-align: center;
  font-size: 0.78rem;
  margin-top: 8px;
  line-height: 1.5;
}

@media (max-width: 420px) {
  .share-actions .btn {
    font-size: 0.82rem;
    padding: 12px 6px;
  }
}

  /* ---------- 响应式 ---------- */
  @media (max-width: 420px) {
    .app { padding: 0 14px 48px; }
    .question-card { padding: 20px 16px; }
    .option { font-size: 0.9rem; padding: 13px 14px; }
    .start-wrap { padding: 30px 0 48px; }
  }
  @media (min-width: 768px) {
    .app { max-width: 680px; }
    .option:hover {
      border-color: rgba(212, 175, 106, 0.45);
      background: rgba(212, 175, 106, 0.06);
    }
  }

/* ============================================================
   状态与逻辑
   ============================================================ */
const OCCURRENCE = {};
SCORE_KEYS.forEach(k => OCCURRENCE[k] = 0);
QUESTIONS.forEach(q => q.opts.forEach(o => { OCCURRENCE[o.k] = (OCCURRENCE[o.k] || 0) + 1; }));

const TOTAL = QUESTIONS.length;
let current = 0;
const answers = new Array(TOTAL).fill(null);

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $('quiz-count').textContent = String(current + 1).padStart(2, '0') + ' / ' + TOTAL;
  $('q-index').textContent = '第 ' + (current + 1) + ' 题';
  $('q-text').textContent = q.q;
  $('progress-fill').style.width = ((current + 1) / TOTAL * 100) + '%';

  const container = $('options');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = '<span class="option-marker">' + letters[i] + '</span><span>' + opt.t + '</span>';
    btn.addEventListener('click', () => selectOption(i));
    container.appendChild(btn);
  });

  $('btn-prev').disabled = current === 0;
  updateNextBtn();
}

let autoTimer = null;

function selectOption(i) {
  answers[current] = i;
  document.querySelectorAll('.option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  updateNextBtn();
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const idx = current;
  // 自动前进（短暂延迟，让选中反馈被看到）；期间若用户回退或改答，则取消本次跳转
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if (current !== idx || answers[idx] === null) return;
    if (current < TOTAL - 1) {
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 260);
}

function updateNextBtn() {
  const btn = $('btn-next');
  const isLast = current === TOTAL - 1;
  btn.textContent = isLast ? '查看结果 ✦' : '下一题 →';
  btn.disabled = answers[current] === null;
}

$('btn-prev').addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(); }
});

$('btn-next').addEventListener('click', () => {
  if (answers[current] === null) return;
  if (current < TOTAL - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
});

$('btn-start').addEventListener('click', () => {
  current = 0;
  answers.fill(null);
  showScreen('screen-quiz');
  renderQuestion();
});

$('btn-restart').addEventListener('click', () => {
  current = 0;
  answers.fill(null);
  showScreen('screen-start');
});

/* ============================================================
   计分与结果
   ============================================================ */
function calculateResult() {
  const scores = {};
  SCORE_KEYS.forEach(k => scores[k] = 0);
  answers.forEach((ansIdx, qi) => {
    if (ansIdx === null) return;
    const key = QUESTIONS[qi].opts[ansIdx].k;
    if (scores[key] !== undefined) scores[key] += 1;
  });
  // 按各恩赐在题面中的出场次数归一，比较“选中比例”，消除题量偏差
  let maxKey = SCORE_KEYS[0];
  let maxRatio = -1;
  SCORE_KEYS.forEach(k => {
    const ratio = OCCURRENCE[k] > 0 ? scores[k] / OCCURRENCE[k] : 0;
    if (ratio > maxRatio) { maxRatio = ratio; maxKey = k; }
  });
  return GIFTS[maxKey];
}

let currentGiftForShare = null;

const SHARE_URL = 'https://wangbin-eye.github.io/huaidan/';

function createShareImage(gift) {
  return new Promise((resolve, reject) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 1080;
    canvas.height = 1350;

    const W = canvas.width;
    const H = canvas.height;
    const accent = gift.theme.accent || '#d4af6a';
    const soft = gift.theme.soft || '#e8cf9a';

    // 深色渐变背景
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#171c2d');
    bg.addColorStop(0.55, '#0b0e1a');
    bg.addColorStop(1, '#15101c');

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 金色边框
    ctx.strokeStyle = 'rgba(212,175,106,0.75)';
    ctx.lineWidth = 3;
    ctx.strokeRect(35, 35, W - 70, H - 70);

    ctx.strokeStyle = 'rgba(212,175,106,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(52, 52, W - 104, H - 104);

    // 顶部装饰光晕
    const glow = ctx.createRadialGradient(
      W / 2, 300, 10,
      W / 2, 300, 480
    );
    glow.addColorStop(0, 'rgba(212,175,106,0.15)');
    glow.addColorStop(1, 'rgba(212,175,106,0)');

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 800);

    // 绘制文字
    function centerText(text, y, size, color, weight = 400) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px "Microsoft YaHei", "PingFang SC", sans-serif`;
      ctx.fillText(text, W / 2, y);
    }

    // 自动换行
    function drawWrapped(text, y, maxWidth, lineHeight, size, color) {
      ctx.font = `${size}px "Microsoft YaHei", "PingFang SC", sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let line = '';
      let currentY = y;

      for (const char of text) {
        const testLine = line + char;

        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, W / 2, currentY);
          line = char;
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }

      if (line) {
        ctx.fillText(line, W / 2, currentY);
        currentY += lineHeight;
      }

      return currentY;
    }

    // 顶部标题
    centerText(
      'SEVEN GIFTS · SOUL QUIZ',
      160, 28, '#d4af6a', 500
    );

    centerText(
      '你的灵魂对应哪一道七恩赐？',
      235, 38, '#f0ead8', 500
    );

    // 装饰符号
    centerText('✧', 390, 105, accent, 400);

    // 恩赐名称
    centerText(gift.name, 550, 104, accent, 700);

    centerText(
      gift.en,
      630, 25, '#a8a090', 400
    );

    // 装饰线
    ctx.fillStyle = 'rgba(212,175,106,0.65)';
    ctx.fillRect(420, 690, 240, 2);

    // 结果寄语
    drawWrapped(
      '「' + gift.tagline + '」',
      770, 820, 58, 32, soft
    );

    // 特征标签
    drawWrapped(
      gift.chips.join('  ·  '),
      980, 850, 48, 27, '#d4af6a'
    );

    // 底部品牌和网址
    ctx.fillStyle = 'rgba(212,175,106,0.35)';
    ctx.fillRect(250, 1110, 580, 1);

    centerText(
      '七恩赐 · 灵魂测试',
      1170, 27, '#d4af6a', 500
    );

    centerText(
      '趣味娱乐测试 · 结果仅供参考',
      1225, 22, '#a8a090', 400
    );

    centerText(
      '点击链接，测测你的灵魂对应哪一道七恩赐',
      1270, 21, '#a8a090', 400
    );

    try {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('图片生成失败'));
      }, 'image/png');
    } catch (error) {
      reject(error);
    }
  });
}

  if (!currentGiftForShare) return;

  const status = document.getElementById('share-status');

  try {
    status.textContent = '正在生成你的专属图片……';

    const blob = await createShareImage(currentGiftForShare);
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = '我的七恩赐测试结果.png';

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 3000);

    status.textContent = '图片已生成，请查看下载文件夹。';
  } catch (error) {
    console.error(error);
    status.textContent = '图片生成失败，请稍后重试。';
  }
}

// 分享图片
async function shareResultCard() {
  if (!currentGiftForShare) return;

  const status = document.getElementById('share-status');

  try {
    status.textContent = '正在准备分享……';

    const blob = await createShareImage(currentGiftForShare);

    const file = new File(
      [blob],
      '我的七恩赐测试结果.png',
      { type: 'image/png' }
    );

    // 支持文件分享的手机浏览器
    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share({
        title: '我的七恩赐测试结果',
        text: '我测出了自己的灵魂恩赐，你也来测测吧！',
        files: [file]
      });

      status.textContent = '分享已完成。';
    } else if (navigator.share) {
      // 不支持分享图片时，至少分享文字和链接
      await navigator.share({
        title: '我的七恩赐测试结果',
        text: '我的结果是：' +
          currentGiftForShare.name +
          '。你也来测测吧！',
        url: SHARE_URL
      });

      status.textContent = '分享已完成。';
    } else {
      // 桌面浏览器不支持系统分享时，自动下载图片
      await downloadShareCard();
      status.textContent = '当前浏览器不支持直接分享，已为你生成图片。';
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      console.error(error);
      status.textContent = '分享暂时不可用，请使用下载图片功能。';
    }
  }
}

// 复制测试链接
async function copyTestLink() {
  const status = document.getElementById('share-status');

  try {
    await navigator.clipboard.writeText(SHARE_URL);
    status.textContent = '测试链接已复制，快发给朋友吧！';
  } catch (error) {
    // 兼容部分浏览器
    window.prompt('请复制下面的测试链接：', SHARE_URL);
  }
}

// 绑定按钮
document.getElementById('btn-download-card')
  .addEventListener('click', downloadShareCard);

document.getElementById('btn-share-card')
  .addEventListener('click', shareResultCard);

document.getElementById('btn-copy-link')
  .addEventListener('click', copyTestLink);

function showResult() {
  const gift = calculateResult();
  currentGiftForShare = gift;
  const t = gift.theme;
  const sr = $('screen-result');
  sr.style.setProperty('--accent', t.accent);
  sr.style.setProperty('--accent-soft', t.soft);
  sr.style.setProperty('--accent-border', t.border);
  sr.style.setProperty('--accent-glow', t.glow);
  sr.style.setProperty('--accent-tint', t.tint);
  $('result-icon').textContent = gift.icon;
  $('result-name').textContent = gift.name;
  $('result-en').textContent = gift.en;
  $('result-tagline').textContent = '「' + gift.tagline + '」';

  $('result-traits').innerHTML = '<p>' + gift.traits + '</p>';
  $('result-chips').innerHTML = gift.chips.map(c =>
    '<span class="trait-chip">' + c + '</span>'
  ).join('');

  $('result-reason').innerHTML = '<p>' + gift.reason + '</p>';
  $('result-hidden').innerHTML = '<p><span class="hidden-gift">' + gift.hidden + '</span></p>';
  $('result-egg').innerHTML = '<p>' + gift.egg + '</p>';

  $('cp-gift').textContent = gift.name;
  $('cp-tag').textContent = '「' + gift.tagline + '」';
  $('cp-traits').textContent = gift.chips.join(' · ');

  showScreen('screen-result');
}

/* 键盘支持（桌面端） */
document.addEventListener('keydown', e => {
  if (!$('screen-quiz').classList.contains('active')) return;
  const key = e.key.toUpperCase();
  const map = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
  if (map[key] !== undefined) selectOption(map[key]);
  if (e.key === 'ArrowLeft') $('btn-prev').click();
  if (e.key === 'ArrowRight' && !$('btn-next').disabled) $('btn-next').click();
});
</script>
